<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Odyssey Synth — музыкальное путешествие с пятью голосами и пиксельными героями Одиссеи.">
  <meta name="theme-color" content="#030303">
  <title>Odyssey Synth</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <!-- ИИ: Codex подготовил интерфейс по правкам автора. README, запись №7. -->
  <div class="grid" aria-hidden="true"></div>
  <div id="lights" aria-hidden="true"></div>
  <button id="traveler" type="button" aria-label="Сменить персонажа">
    <span class="sprite" aria-hidden="true"></span>
    <span class="traveler-name" aria-hidden="true">ОДИССЕЙ</span>
  </button>
  <main class="info">
    <h1>Odyssey Synth</h1>
    <p>Нажимайте клавиши</p>
    <div class="small-controls">
      <button id="motif" type="button" aria-pressed="false" title="Трёхминутное путешествие · 80 BPM · пробел — начать или завершить">▷ Путь домой</button>
      <details id="mixer">
        <summary aria-label="Громкость голосов" title="Громкость">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 3v14M10 3v14M16 3v14" stroke="currentColor" stroke-opacity=".4"/>
            <path d="M1 7h6M7 13h6M13 6h6" stroke="currentColor" stroke-width="2"/>
          </svg>
        </summary>
        <div class="mixer-panel" role="group" aria-label="Громкость голосов"></div>
      </details>
    </div>
  </main>
  <div class="keyboard" id="keyboard" role="group" aria-label="Пять голосов инструмента"></div>
  <noscript>Для работы инструмента включите JavaScript в браузере.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
